name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "suko/web/**"
      - "suko/app/**"
      - "suko/*.gradle.kts"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: suko/web/package-lock.json

      - name: Build Studio web assets for Android
        working-directory: suko/web
        run: |
          npm ci
          npm run build:suko

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;26.1.10909125"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: suko
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sukko-debug-APK
          path: suko/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
