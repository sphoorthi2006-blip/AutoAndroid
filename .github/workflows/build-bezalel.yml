name: Build Bezalel APK
on:
  push:
    branches: [ main, bezalel-step11 ]
    paths:
      - 'bezalel/**'
      - '.github/workflows/build-bezalel.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.BEZALEL_KEYSTORE_B64 != '' }}
    defaults:
      run:
        working-directory: bezalel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Run logic tests
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon 2>&1 | tee -a /tmp/build.log
      - name: Build the signed release APK (only on main, only when the keystore secrets exist)
        if: github.ref == 'refs/heads/main' && env.HAS_KEYSTORE == 'true'
        env:
          BEZALEL_STORE_PASSWORD: ${{ secrets.BEZALEL_STORE_PASSWORD }}
          BEZALEL_KEY_ALIAS: ${{ secrets.BEZALEL_KEY_ALIAS }}
          BEZALEL_KEY_PASSWORD: ${{ secrets.BEZALEL_KEY_PASSWORD }}
          KS_B64: ${{ secrets.BEZALEL_KEYSTORE_B64 }}
        run: |
          set -o pipefail
          echo "$KS_B64" | base64 -d > /tmp/bezalel.jks
          export BEZALEL_KEYSTORE=/tmp/bezalel.jks
          gradle :app:assembleRelease --no-daemon 2>&1 | tee -a /tmp/build.log
          ls -la app/build/outputs/apk/release/
      - uses: actions/upload-artifact@v4
        with:
          name: Bezalel-debug-apk
          path: bezalel/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as a release (download link)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/bezalel-step11'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk Bezalel.apk; KIND="signed release"
          else
            cp app/build/outputs/apk/debug/app-debug.apk Bezalel.apk; KIND="debug"
          fi
          gh release delete bezalel-latest -y --cleanup-tag || true
          gh release create bezalel-latest Bezalel.apk --title "Bezalel (latest build)" --notes "Latest Bezalel $KIND APK from branch ${{ github.ref_name }}." --target "${{ github.sha }}"
      - name: Save error log to the buildlog-bezalel branch
        if: failure()
        run: |
          mkdir /tmp/out
          touch /tmp/build.log
          { grep -E "^e: |^w: |FAILED|Exception|Error|What went wrong|expected|but was" /tmp/build.log | head -150; echo ----; tail -60 /tmp/build.log; } > /tmp/out/log.txt
          cd /tmp/out
          git init -q
          git checkout -q -b buildlog-bezalel
          git add log.txt
          git -c user.name=ci -c user.email=ci@example.com commit -q -m "log"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" buildlog-bezalel
