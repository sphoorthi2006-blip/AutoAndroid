name: Build APK
on:
  push:
    branches-ignore: [ buildlog ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Run logic tests
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon 2>&1 | tee -a /tmp/build.log
      - uses: actions/upload-artifact@v4
        with:
          name: CueVideo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as a release (download link)
        if: github.ref == 'refs/heads/cuevideo'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk CueVideo.apk
          gh release delete cuevideo-latest -y --cleanup-tag || true
          gh release create cuevideo-latest CueVideo.apk --title "Cue Video (latest build)" --notes "Latest Cue Video debug APK from branch cuevideo." --target "${{ github.sha }}"
      - name: Save error log to the buildlog branch
        if: failure()
        run: |
          mkdir /tmp/out
          { grep -E "^e: |^w: .*(Stage|Main|Video|Clip|Gl|Export)|FAILED|Exception|Error|What went wrong|expected|but was" /tmp/build.log | head -150; echo ----; tail -60 /tmp/build.log; } > /tmp/out/log.txt
          cd /tmp/out
          git init -q
          git checkout -q -b buildlog
          git add log.txt
          git -c user.name=ci -c user.email=ci@example.com commit -q -m "log"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" buildlog
