name: Check core

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install Python test dependencies
        run: pip install numpy fastapi uvicorn python-multipart silero-vad-lite httpx pytest
      - name: Install Kotlin compiler
        run: |
          curl -sL -o kotlinc.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q kotlinc.zip -d "$HOME"
          echo "$HOME/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Kotlin results must equal the Python engine's results
        run: scripts/run_parity.sh
      - name: Backend tests (fake speech models)
        run: python3 -m pytest -q backend/tests
