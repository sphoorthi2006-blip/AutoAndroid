name: Voice App
on:
  push:
    branches: [ main ]
    paths:
      - 'voice-app/**'
      - '.github/workflows/build-voice-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Accept Android SDK licenses
        run: (yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null) || true

      - name: Fetch sherpa-onnx native libraries and the matching Kotlin file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$(gh release view -R k2-fsa/sherpa-onnx --json tagName --jq .tagName)
          echo "sherpa-onnx release: $TAG"
          gh release view "$TAG" -R k2-fsa/sherpa-onnx --json assets --jq '.assets[].name' | grep -i android || true
          mkdir -p /tmp/sherpa/x
          gh release download "$TAG" -R k2-fsa/sherpa-onnx -p '*-android.tar.bz2' -D /tmp/sherpa
          ls -la /tmp/sherpa
          tar -xjf /tmp/sherpa/*-android.tar.bz2 -C /tmp/sherpa/x
          ARM=$(find /tmp/sherpa/x -type d -name arm64-v8a | head -1)
          echo "arm64 libs in: $ARM"
          test -n "$ARM"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$ARM"/*.so app/src/main/jniLibs/arm64-v8a/
          ls -la app/src/main/jniLibs/arm64-v8a
          # The Kotlin file must come from the same release as the native libraries.
          mkdir -p app/src/main/java/com/k2fsa/sherpa/onnx
          curl -fsSL --retry 3 -o app/src/main/java/com/k2fsa/sherpa/onnx/Tts.kt \
            "https://raw.githubusercontent.com/k2-fsa/sherpa-onnx/$TAG/sherpa-onnx/kotlin-api/Tts.kt"
          head -n 5 app/src/main/java/com/k2fsa/sherpa/onnx/Tts.kt
          grep -q 'package com.k2fsa.sherpa.onnx' app/src/main/java/com/k2fsa/sherpa/onnx/Tts.kt

      - name: Fetch the Kokoro model (54 voices)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/model/x app/src/main/assets
          gh release download tts-models -R k2-fsa/sherpa-onnx -p 'kokoro-multi-lang-v1_0.tar.bz2' -D /tmp/model
          tar -xjf /tmp/model/kokoro-multi-lang-v1_0.tar.bz2 -C /tmp/model/x
          mv /tmp/model/x/kokoro-multi-lang-v1_0 app/src/main/assets/kokoro-multi-lang-v1_0
          ls -la app/src/main/assets/kokoro-multi-lang-v1_0
          for f in model.onnx voices.bin tokens.txt; do
            test -s "app/src/main/assets/kokoro-multi-lang-v1_0/$f"
          done
          test -d app/src/main/assets/kokoro-multi-lang-v1_0/espeak-ng-data

      - name: Build debug APK
        run: |
          set +e
          gradle :app:assembleDebug --no-daemon 2>&1 | tee /tmp/build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            msg=$(grep -E '^e: |error:|What went wrong' -A2 /tmp/build.log | head -40 | cut -c1-300)
            echo "::error title=Build errors::${msg//$'\n'/%0A}"
            exit "$code"
          fi

      - name: Check the APK contains the libraries and the model
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          ls -la "$apk"
          unzip -l "$apk" | grep -E 'libsherpa-onnx-jni.so|libonnxruntime.so|kokoro-multi-lang-v1_0/model.onnx|kokoro-multi-lang-v1_0/voices.bin'
          cp "$apk" VoiceApp.apk

      - uses: actions/upload-artifact@v4
        with:
          name: voice-app-apk
          path: voice-app/VoiceApp.apk

      - name: Publish VoiceApp.apk as a release (best effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view voice-app-latest >/dev/null 2>&1; then
            gh release upload voice-app-latest VoiceApp.apk --clobber
          else
            gh release create voice-app-latest VoiceApp.apk --title "Voice App (latest)" --notes "Offline Kokoro text-to-speech with voice mixing" --target "${{ github.sha }}"
          fi
